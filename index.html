  return `<svg viewBox='0 0 64 56'><defs><clipPath id='kc'><ellipse cx='32' cy='36.5' rx='20' ry='7'/></clipPath></defs>${sau}<ellipse cx='32' cy='36.5' rx='20' ry='7' fill='#d9962f'/><g clip-path='url(#kc)'>${s}</g></svg>`}
 if(id=='hz'){const c=['#d9a566','#8a5a2c','#b9854a'];let s='';[[22,37],[29,34],[37,35],[43,38],[27,40],[35,40],[19,40],[40,32]].forEach(([x,y],k)=>s+=`<ellipse cx='${x}' cy='${y}' rx='4.4' ry='3.6' fill='${c[k%3]}' stroke='#5a3516' stroke-width='.4' transform='rotate(${k*40} ${x} ${y})'/>`);return `<svg viewBox='0 0 64 56'>${sau}${s}</svg>`}
 const [a,b,c]=DOL[id]||DOL.nut;
 return `<svg viewBox='0 0 64 56'>${sau}<ellipse cx='32' cy='36.5' rx='21' ry='7.6' fill='${c}'/><ellipse cx='32' cy='36' rx='19' ry='6.6' fill='${b}'/><path d='M17 36c5-3 10-4 15-3s10 1 15 3' fill='none' stroke='${a}' stroke-width='1.4' stroke-linecap='round' opacity='.8'/><path d='M21 39c4-2 8-2 12-1.5' fill='none' stroke='${a}' stroke-width='1' opacity='.6'/><ellipse cx='25' cy='33.6' rx='6.5' ry='1.6' fill='#fff' opacity='.5' transform='rotate(-8 25 33.6)'/></svg>`}

try{LANG=sessionStorage.lang||'en'}catch(e){}applyLang();
